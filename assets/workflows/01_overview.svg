   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b4f9b" x="103.68" y="38.126438" transform="rotate(-0 103.68 38.126438)">FRAUD INTELLIGENCE AGENT</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #526574" x="1094.4" y="38.126438" transform="rotate(-0 1094.4 38.126438)">01 / OVERVIEW</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 29px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #152a3b" x="57.6" y="91.155469" transform="rotate(-0 57.6 91.155469)">From a suspicious transaction to an informed review</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526574" x="57.6" y="131.230125" transform="rotate(-0 57.6 131.230125)">The model prioritizes risk; the evidence assistant prepares the case; the analyst decides.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b4f9b" x="73.728" y="261.430594" transform="rotate(-0 73.728 261.430594)">01 / SCORE</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #152a3b" x="73.728" y="287.117813" transform="rotate(-0 73.728 287.117813)">Transaction risk</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11.3px; font-family: 'DejaVu Sans'; fill: #526574" transform="translate(73.728 313.866234)">Use current details</text>
    <text style="font-size: 11.3px; font-family: 'DejaVu Sans'; fill: #526574" transform="translate(73.728 328.666321)">and prior behavior</text>
    <text style="font-size: 11.3px; font-family: 'DejaVu Sans'; fill: #526574" transform="translate(73.728 343.466408)">to estimate risk</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b4f9b" x="344.448" y="261.430594" transform="rotate(-0 344.448 261.430594)">02 / PRIORITIZE</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; fill: #152a3b" transform="translate(344.448 287.117813)">Capacity-based</text>
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; fill: #152a3b" transform="translate(344.448 305.563578)">alert</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #526574" transform="translate(344.448 330.690328)">Threshold ≈0.690</text>
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #526574" transform="translate(344.448 344.70457)">Validation rule: at most</text>
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #526574" transform="translate(344.448 358.718811)">50 alerts per 1,000</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b4f9b" x="615.168" y="261.430594" transform="rotate(-0 615.168 261.430594)">03 / INVESTIGATE</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #152a3b" x="615.168" y="287.117813" transform="rotate(-0 615.168 287.117813)">Evidence + policy</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #526574" transform="translate(615.168 313.410328)">Fetch transaction history</text>
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #526574" transform="translate(615.168 327.42457)">Retrieve policy sections</text>
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #526574" transform="translate(615.168 341.438811)">Prepare cited summary</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b7dee1" x="885.888" y="261.430594" transform="rotate(-0 885.888 261.430594)">04 / DECIDE</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="885.888" y="287.117813" transform="rotate(-0 885.888 287.117813)">Human analyst</text>
   </g>
   <g id="text_16">
    <text style="font-size: 11.3px; font-family: 'DejaVu Sans'; fill: #e0eaee" transform="translate(885.888 313.866234)">Review the evidence</text>
    <text style="font-size: 11.3px; font-family: 'DejaVu Sans'; fill: #e0eaee" transform="translate(885.888 328.666321)">and authorize any</text>
    <text style="font-size: 11.3px; font-family: 'DejaVu Sans'; fill: #e0eaee" transform="translate(885.888 343.466408)">financial action</text>
   </g>
   <g id="text_17">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526574" x="80.64" y="500.629969" transform="rotate(-0 80.64 500.629969)">Assistant output: signals + policy citations + CLOSE / REVIEW / ESCALATE recommendation</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 17.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #152a3b" x="77.184" y="601.969266" transform="rotate(-0 77.184 601.969266)">0.584% fraud</text>
   </g>
   <g id="text_19">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526574" x="77.184" y="629.830406" transform="rotate(-0 77.184 629.830406)">100,000 synthetic transactions</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 17.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #152a3b" x="422.784" y="601.969266" transform="rotate(-0 422.784 601.969266)">40.1 alerts / 1,000</text>
   </g>
   <g id="text_21">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526574" x="422.784" y="629.830406" transform="rotate(-0 422.784 629.830406)">Future test at frozen threshold</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 17.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #152a3b" x="768.384" y="601.969266" transform="rotate(-0 768.384 601.969266)">Human authority</text>
   </g>
   <g id="text_23">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526574" x="768.384" y="629.830406" transform="rotate(-0 768.384 629.830406)">No automatic account blocking</text>
   </g>
   <g id="text_24">
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526574" x="57.6" y="686.822531" transform="rotate(-0 57.6 686.822531)">Synthetic customers, transactions and policies. Evidence supports review; it does not prove fraud.</text>
   </g>
   <g id="text_25">
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #526574" x="1094.4" y="686.822531" transform="rotate(-0 1094.4 686.822531)">FRAUD / 01</text>
   </g>
  </g>
